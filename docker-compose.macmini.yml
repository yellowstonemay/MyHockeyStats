# MyHockeyStats - Mac Mini M4 Production Stack
# Deploy the full application (Postgres + Backend + Frontend) on the Mac mini.
# Served through Cloudflare Tunnel for public access.

services:
  postgres-db:
    image: postgres:15-alpine
    container_name: hockey-postgres
    restart: always
    environment:
      POSTGRES_DB: hockey_stats
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-your_secure_password}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d hockey_stats"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: myhockeystats-backend
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/hockey_stats
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-your_secure_password}
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      # Signing key for auth JWTs. Without this the backend uses the dev
      # fallback hardcoded in JwtUtil, which anyone can read in the repo.
      JWT_SECRET: ${JWT_SECRET:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      APP_AI_DAILY_CAP_USD: ${APP_AI_DAILY_CAP_USD:-0.20}
      APP_AI_WEEKLY_PER_USER: ${APP_AI_WEEKLY_PER_USER:-1}
      # Social sign-in (Google / Facebook). Set these in .env on the host.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-https://youthhockeystats.us/api/auth/oauth2/callback/google}
      FACEBOOK_CLIENT_ID: ${FACEBOOK_CLIENT_ID:-}
      FACEBOOK_CLIENT_SECRET: ${FACEBOOK_CLIENT_SECRET:-}
      FACEBOOK_REDIRECT_URI: ${FACEBOOK_REDIRECT_URI:-https://youthhockeystats.us/api/auth/oauth2/callback/facebook}
      APP_OAUTH_FRONTEND_CALLBACK_URL: ${APP_OAUTH_FRONTEND_CALLBACK_URL:-https://youthhockeystats.us/oauth/callback}
      # Email verification for password signup. Without SMTP the signup
      # endpoint refuses new accounts rather than creating ones nobody can
      # confirm, so set these before relying on password signup.
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL:-https://youthhockeystats.us}
      APP_MAIL_FROM: "${APP_MAIL_FROM:-MyHockeyStats <no-reply@youthhockeystats.us>}"
      APP_REQUIRE_EMAIL_VERIFICATION: ${APP_REQUIRE_EMAIL_VERIFICATION:-true}
    ports:
      - "8080:8080"
    depends_on:
      postgres-db:
        condition: service_healthy

  frontend:
    build: ./frontend/web
    container_name: myhockeystats-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

  # Optional: Expose through Cloudflare Tunnel
  # Uncomment after running: cloudflared tunnel login && cloudflared tunnel create myhockeystats
  # Then set CLOUDFLARE_TUNNEL_TOKEN in .env or environment
  # cloudflared:
  #   image: cloudflare/cloudflared:latest
  #   container_name: myhockeystats-tunnel
  #   restart: always
  #   command: tunnel run
  #   environment:
  #     - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}

volumes:
  pgdata:

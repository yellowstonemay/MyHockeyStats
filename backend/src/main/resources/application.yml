server:
  port: 8080

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/myhockeystats}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  flyway:
    baseline-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

logging:
  level:
    root: INFO
    org.springframework.web: INFO

app:
  ai:
    enabled: true
    provider: deepseek
    model: deepseek-v4-flash
    base-url: https://api.deepseek.com
    api-key: ${DEEPSEEK_API_KEY:}
    daily-cap-usd: ${APP_AI_DAILY_CAP_USD:0.20}
    weekly-per-user: ${APP_AI_WEEKLY_PER_USER:1}
    max-output-tokens: 2000
    price-input-per-m: 0.14        # USD per 1M input tokens (cache miss)
    price-output-per-m: 0.28       # USD per 1M output tokens
